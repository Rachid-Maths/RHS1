<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الكلمات">
    <meta name="format-detection" content="telephone=no">
    <title>لعبة كتابة الكلمات - للأطفال</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#667eea">
    
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .app-shell {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container,
        .home-container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .game-container {
            padding-bottom: max(40px, env(safe-area-inset-bottom));
        }

        .header {
            margin-bottom: 20px;
        }

        .stars {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 24px;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .progress {
            font-size: 18px;
            color: #888;
        }

        .image-area {
            font-size: 150px;
            margin: 30px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hint {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .input-area {
            margin-bottom: 20px;
            position: relative;
            max-width: 420px;
            margin-inline: auto;
        }

        .input-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #fffdf5 0%, #f7eed8 100%);
            border: 2px dashed #d8c49a;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }

        input {
            position: relative;
            z-index: 1;
            background: transparent;
            border: none;
            padding: 24px 20px;
            font-size: 32px;
            border-radius: 20px;
            width: 100%;
            text-align: center;
            outline: none;
            transition: 0.3s;
            color: #333;
            touch-action: manipulation;
        }

        input::placeholder {
            color: transparent;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            min-height: 48px;
            min-width: 48px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        button:active {
            transform: scale(0.97);
        }

        .check-btn {
            background: #667eea;
            color: white;
        }

        .check-btn:hover {
            background: #5a6fd6;
        }

        .check-btn:hover,
        .hint-btn:hover,
        .reset-btn:hover,
        .start-btn:hover {
            transform: scale(1.05);
        }

        @media (hover: none) {
            .check-btn:hover,
            .hint-btn:hover,
            .reset-btn:hover,
            .start-btn:hover {
                transform: none;
            }
        }

        .hint-btn {
            background: #ffa502;
            color: white;
        }

        .hint-btn:hover {
            background: #e8960a;
        }

        .reset-btn {
            background: #ff6b6b;
            color: white;
        }

        .reset-btn:hover {
            background: #ee5a5a;
        }

        .feedback {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 40px;
        }

        .correct {
            color: #2ed573;
            animation: pop 0.5s ease;
        }

        .wrong {
            color: #ff4757;
            animation: shake 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: fall 3s ease-in forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ✅ إشعار التثبيت */
        .install-banner {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            display: none;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            width: 100%;
        }

        .home-container {
            padding-bottom: max(50px, env(safe-area-inset-bottom));
        }

        .home-title {
            font-size: 36px;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .home-subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 30px;
        }

        .home-emoji {
            font-size: 100px;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }

        .home-description {
            font-size: 18px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 50px;
            font-size: 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            width: 100%;
            max-width: 280px;
        }

        .install-btn {
            margin-top: 12px;
            background: #856404;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .home-features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .home-feature {
            background: #f8f9ff;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 16px;
            color: #667eea;
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding-top: max(12px, env(safe-area-inset-top));
            }

            .game-container,
            .home-container {
                padding: 24px 18px;
                border-radius: 22px;
            }

            .home-title {
                font-size: 28px;
            }

            .home-subtitle {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .home-emoji {
                font-size: 72px;
                margin-bottom: 16px;
            }

            .home-description {
                font-size: 16px;
                margin-bottom: 24px;
            }

            .start-btn {
                font-size: 22px;
                padding: 16px 24px;
                max-width: none;
            }

            .stars {
                font-size: 32px;
            }

            .score {
                font-size: 20px;
            }

            .progress {
                font-size: 16px;
            }

            .image-area {
                font-size: 110px;
                margin: 20px 0;
            }

            .hint {
                font-size: 17px;
                min-height: 24px;
            }

            input {
                font-size: 28px;
                padding: 20px 16px;
            }

            .buttons {
                flex-direction: column;
                gap: 12px;
            }

            button {
                width: 100%;
                font-size: 18px;
                padding: 14px 20px;
            }

            .feedback {
                font-size: 20px;
            }

            .install-banner {
                font-size: 14px;
                padding: 12px;
            }

            .home-features {
                gap: 10px;
            }

            .home-feature {
                font-size: 14px;
                padding: 10px 14px;
            }
        }

        @media (max-width: 360px) {
            .image-area {
                font-size: 90px;
            }

            .home-title {
                font-size: 24px;
            }

            input {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
    <div class="home-container screen active" id="homeScreen">
        <div class="home-emoji">📚✨</div>
        <h1 class="home-title">لعبة كتابة الكلمات</h1>
        <p class="home-subtitle">للأطفال الصغار</p>
        <p class="home-description">
            انظر إلى الصورة واكتب الكلمة العربية الصحيحة!<br>
            اجمع النجوم وكن بطلاً في اللغة العربية 🌟
        </p>
        <button class="start-btn" id="startBtn" type="button">🎮 ابدأ اللعب</button>
        <button class="install-btn" id="installBtn" type="button">📲 ثبّت التطبيق</button>
        <div class="home-features">
            <span class="home-feature">📝 5 أسئلة</span>
            <span class="home-feature">⭐ نقاط ونجوم</span>
            <span class="home-feature">💡 تلميحات</span>
        </div>
    </div>

    <div class="game-container screen" id="gameScreen">
        <div class="install-banner" id="installBanner">
            📲 يمكنك تثبيت اللعبة على هاتفك للعب في أي وقت!
        </div>
        
        <div class="header">
            <div class="stars" id="starsDisplay">☆☆☆☆☆</div>
            <div class="score">النقاط: <span id="score">0</span></div>
            <div class="progress">سؤال <span id="currentQ">1</span> من <span id="totalQ">5</span></div>
        </div>
        
        <div class="image-area" id="imageDisplay">🍎</div>
        <div class="hint" id="hintDisplay"></div>
        
        <div class="input-area">
            <input type="text" id="answerInput" placeholder="" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="done" lang="ar">
        </div>
        
        <div class="buttons">
            <button class="check-btn" type="button">✅ تحقق</button>
            <button class="hint-btn" type="button">💡 تلميح</button>
            <button class="reset-btn" type="button">🔄 لعبة جديدة</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>
    </div>
    
    <div class="celebration" id="celebration"></div>

    <script>
        // ============ Service Worker للعمل بدون إنترنت ============
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function() {
                        console.log('✅ التطبيق جاهز للعمل بدون إنترنت');
                    })
                    .catch(function(err) {
                        console.log('تنبيه:', err);
                    });
            });
        }

        // ============ تثبيت التطبيق على الهاتف ============
        let deferredPrompt = null;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        function showInstallOptions() {
            if (isStandalone) return;

            const installBanner = document.getElementById('installBanner');
            const installBtn = document.getElementById('installBtn');

            if (deferredPrompt) {
                installBanner.style.display = 'block';
                installBtn.style.display = 'inline-block';
                installBtn.textContent = '📲 ثبّت التطبيق';
                return;
            }

            if (isIOS) {
                installBanner.style.display = 'block';
                installBanner.innerHTML = '📲 على iPhone: اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»';
                installBtn.style.display = 'inline-block';
                installBtn.textContent = '📲 كيف أثبّت التطبيق؟';
            }
        }

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            showInstallOptions();
        });

        function promptInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.finally(function() {
                    deferredPrompt = null;
                    document.getElementById('installBtn').style.display = 'none';
                });
                return;
            }

            if (isIOS) {
                alert('لتثبيت اللعبة على iPhone:\n1. اضغط زر المشاركة ⬆️ في Safari\n2. اختر «إضافة إلى الشاشة الرئيسية»\n3. اضغط «إضافة»');
            }
        }

        function scrollInputIntoView() {
            const input = document.getElementById('answerInput');
            setTimeout(function() {
                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        }

        function focusAnswerInput() {
            const input = document.getElementById('answerInput');
            input.focus({ preventScroll: true });
            scrollInputIntoView();
        }
        
        // ============ كود اللعبة ============
        const wordsList = [
            { emoji: "🍎", word: "تفاحة", praise: "أحسنت، إنها تفاحة" },
            { emoji: "🐱", word: "قطة", praise: "أحسنت، إنها قطة" },
            { emoji: "☀️", word: "شمس", praise: "أحسنت، إنها شمس" },
            { emoji: "🌙", word: "هلال", praise: "أحسنت، إنه هلال" },
            { emoji: "🏠", word: "بيت", praise: "أحسنت، إنه بيت" },
            { emoji: "📚", word: "كتب", praise: "أحسنت، إنها كتب" },
            { emoji: "✏️", word: "قلم", praise: "أحسنت، إنه قلم" },
            { emoji: "🌹", word: "وردة", praise: "أحسنت، إنها وردة" },
            { emoji: "🐟", word: "سمكة", praise: "أحسنت، إنها سمكة" },
            { emoji: "✈️", word: "طائرة", praise: "أحسنت، إنها طائرة" }
        ];

        function getFirstLetterHint(word) {
            const cleaned = word.replace(/^[ً-ْ\s]+/, '').trim();
            const firstLetter = Array.from(cleaned)[0] || '';
            return 'الحرف الأول: ' + firstLetter;
        }

        let maleArabicVoice = null;

        function isFemaleArabicVoice(voice) {
            return /female|hoda|salma|amira|layla|laila|zira|naura|fatima|mariam|maryam/i.test(voice.name);
        }

        function loadMaleArabicVoice() {
            if (!('speechSynthesis' in window)) return;

            const voices = window.speechSynthesis.getVoices();
            const arabicVoices = voices.filter(function(v) {
                return v.lang.startsWith('ar') && !isFemaleArabicVoice(v);
            });

            maleArabicVoice =
                arabicVoices.find(function(v) { return /naayf|hamed|tarik|majid|malek|youssef|omar|male/i.test(v.name); }) ||
                arabicVoices[0] ||
                null;
        }

        if ('speechSynthesis' in window) {
            loadMaleArabicVoice();
            window.speechSynthesis.onvoiceschanged = loadMaleArabicVoice;
        }

        let currentIndex = 0;
        let score = 0;
        let totalQuestions = 5;
        let questions = [];
        let hintUsed = false;
        let gameFinished = false;
        let isTransitioning = false;

        function initGame() {
            let shuffled = [...wordsList].sort(() => Math.random() - 0.5);
            questions = shuffled.slice(0, totalQuestions);
            currentIndex = 0;
            score = 0;
            hintUsed = false;
            gameFinished = false;
            isTransitioning = false;
            updateDisplay();
            document.getElementById('score').textContent = '0';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('hintDisplay').textContent = '';
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').disabled = false;
            document.getElementById('celebration').innerHTML = '';
            updateStars();
        }

        function updateDisplay() {
            document.getElementById('imageDisplay').textContent = questions[currentIndex].emoji;
            document.getElementById('currentQ').textContent = currentIndex + 1;
            document.getElementById('totalQ').textContent = totalQuestions;
            document.getElementById('answerInput').value = '';
            document.getElementById('hintDisplay').textContent = '';
            hintUsed = false;
        }

        function checkAnswer() {
            if (gameFinished || isTransitioning) return;
            
            let userAnswer = document.getElementById('answerInput').value.trim();
            let correctAnswer = questions[currentIndex].word;
            let feedbackDiv = document.getElementById('feedback');
            
            if (userAnswer === '') {
                feedbackDiv.textContent = '✍️ اكتب الكلمة أولاً يا بطل!';
                feedbackDiv.className = 'feedback wrong';
                return;
            }
            
            if (userAnswer.toLowerCase() === correctAnswer.toLowerCase() || 
                userAnswer.replace(/[ً-ْ]/g, '') === correctAnswer.replace(/[ً-ْ]/g, '')) {
                
                isTransitioning = true;
                document.getElementById('answerInput').disabled = true;

                feedbackDiv.textContent = '🎉 ممتاز! إجابة صحيحة';
                feedbackDiv.className = 'feedback correct';
                
                if (!hintUsed) {
                    score += 10;
                } else {
                    score += 5;
                }
                
                document.getElementById('score').textContent = score;
                updateStars();
                createConfetti();
                speakPraise(questions[currentIndex], nextQuestion);
                
            } else {
                feedbackDiv.textContent = '❌ حاول مرة أخرى!';
                feedbackDiv.className = 'feedback wrong';
                document.getElementById('answerInput').value = '';
            }
        }

        function speakPraise(question, onComplete) {
            if (!('speechSynthesis' in window)) {
                setTimeout(onComplete, 1500);
                return;
            }

            loadMaleArabicVoice();

            const text = question.praise || ('أحسنت، إنها ' + question.word);
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            utterance.pitch = 0.85;

            if (maleArabicVoice) {
                utterance.voice = maleArabicVoice;
            }

            utterance.onend = function() {
                setTimeout(onComplete, 400);
            };

            utterance.onerror = function() {
                setTimeout(onComplete, 1500);
            };

            window.speechSynthesis.cancel();

            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }

            window.speechSynthesis.speak(utterance);
        }

        function nextQuestion() {
            currentIndex++;
            isTransitioning = false;
            
            if (currentIndex >= totalQuestions) {
                endGame();
            } else {
                document.getElementById('answerInput').disabled = false;
                updateDisplay();
                document.getElementById('feedback').textContent = '';
                document.getElementById('feedback').className = 'feedback';
                focusAnswerInput();
            }
        }

        function endGame() {
            gameFinished = true;
            document.getElementById('answerInput').disabled = true;
            
            let maxScore = totalQuestions * 10;
            let percentage = (score / maxScore) * 100;
            let message = '';
            
            if (percentage === 100) {
                message = '🏆 أنت بطل! علامة كاملة!';
            } else if (percentage >= 70) {
                message = '👏 عمل رائع! استمر بالتقدم!';
            } else if (percentage >= 50) {
                message = '😊 جيد! تدرب أكثر وستصبح أفضل!';
            } else {
                message = '💪 لا بأس! جرب مرة أخرى وستتحسن!';
            }
            
            document.getElementById('feedback').textContent = message;
            document.getElementById('feedback').className = 'feedback correct';
            document.getElementById('imageDisplay').textContent = '🎊';
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => createConfetti(), i * 100);
            }
        }

        function showHint() {
            if (gameFinished) return;

            const hintDisplay = document.getElementById('hintDisplay');
            if (hintDisplay.textContent !== '') return;
            
            hintUsed = true;
            const hint = getFirstLetterHint(questions[currentIndex].word);
            hintDisplay.textContent = '💡 ' + hint;
            
            if (score > 0) {
                score = Math.max(0, score - 1);
                document.getElementById('score').textContent = score;
                updateStars();
            }
        }

        function updateStars() {
            let maxScore = totalQuestions * 10;
            let percentage = (score / maxScore) * 100;
            let starsCount = 0;
            
            if (percentage >= 90) starsCount = 5;
            else if (percentage >= 70) starsCount = 4;
            else if (percentage >= 50) starsCount = 3;
            else if (percentage >= 30) starsCount = 2;
            else if (percentage > 0) starsCount = 1;
            
            let starsStr = '';
            for (let i = 0; i < 5; i++) {
                starsStr += i < starsCount ? '⭐' : '☆';
            }
            document.getElementById('starsDisplay').textContent = starsStr;
        }

        function createConfetti() {
            let celebration = document.getElementById('celebration');
            let colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff922b', '#cc5de8'];
            
            for (let i = 0; i < 10; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -20 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                celebration.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 3500);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(function(screen) {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            showScreen('gameScreen');
            initGame();
            focusAnswerInput();
        }

        function resetGame() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            isTransitioning = false;
            initGame();
        }

        document.addEventListener('DOMContentLoaded', function() {
            showInstallOptions();

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('installBtn').addEventListener('click', promptInstall);
            document.querySelector('.check-btn').addEventListener('click', checkAnswer);
            document.querySelector('.hint-btn').addEventListener('click', showHint);
            document.querySelector('.reset-btn').addEventListener('click', resetGame);

            const answerInput = document.getElementById('answerInput');
            answerInput.addEventListener('focus', scrollInputIntoView);

            answerInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkAnswer();
                }
            });

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    if (document.activeElement === answerInput) {
                        scrollInputIntoView();
                    }
                });
            }
        });
    </script>
</body>
</html>
